services:
  - type: web
    name: universal-downloader
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: YOUTUBE_DL_SKIP_PYTHON_CHECK
        value: "1"
