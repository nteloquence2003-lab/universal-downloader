services:
  - type: web
    name: universal-downloader
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: YOUTUBE_DL_SKIP_PYTHON_CHECK
        value: "1"
      - key: YT_DLP_POT_ENABLED
        value: "1"
      - key: YT_DLP_POT_BASE_URL
        value: "http://127.0.0.1:4416"
      - key: YT_DLP_BIN
        value: "/usr/local/bin/yt-dlp"
